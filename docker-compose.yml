services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rabies_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rabies_db"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/rabies_db"
      JWT_SECRET: "change_this_to_a_strong_random_secret"
      JWT_EXPIRES_IN: "7d"
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/storage:/app/storage

  hospital-portal:
    build: ./hospital-portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: "http://localhost:5000"

  government-portal:
    build: ./government-portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"
    environment:
      VITE_API_URL: "http://localhost:5000"

volumes:
  pgdata: